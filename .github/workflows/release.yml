---
name: Release
run-name: ${{ github.workflow }} / ${{ github.actor }}
on:
  pull_request:
    types: [closed]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Tag
        uses: K-Phoen/semver-release-action@master
        with:
          release_branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
